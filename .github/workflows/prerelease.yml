name: Prerelease

on:
  workflow_dispatch:

# One prerelease at a time: two dispatches in quick succession would otherwise
# race for the same version.
concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prerelease:
    name: Publish prerelease
    runs-on: ubuntu-latest
    steps:
      # main only moves by fast-forward; all releases are cut from dev.
      - name: Ensure the prerelease runs on dev
        if: github.ref_name != 'dev'
        run: |
          echo "Prereleases can only be dispatched on dev, not '${{ github.ref_name }}'." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          # Full history and tags, or semantic-release cannot see the last release.
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # Don't let GITHUB_TOKEN shadow the bot token.
          persist-credentials: false

      # The bot skips the branch protection checks.
      - name: Sign in as release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Stamp version and publish
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: 'plainlang-release[bot]'
          git_committer_email: '324082215+plainlang-release[bot]@users.noreply.github.com'
          # rc releases write their changelog sections too: semantic-release
          # sections the changelog per tag, so skipping rc's would leave their
          # commits out of the stable release's section for good.
          changelog: true

      - name: Prerelease summary
        if: always()
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Prereleased ${{ steps.release.outputs.tag }} - ${{ steps.release.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prerelease: nothing on dev bumped the version." >> "$GITHUB_STEP_SUMMARY"
          fi
