name: PR checks

# Everything a PR must pass before merging into dev. PRs are the only entry
# point that needs checking: dev takes rebase-merged PRs only (which keep
# commit messages verbatim) and main only receives fast-forward pushes from
# dev.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitlint:
    name: Validations / commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Lint commit messages
        env:
          # Audit is advisory-only and its registry endpoint outages stall npx
          # for minutes, so skip it for this throwaway toolchain install.
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  tests:
    name: Tests / python (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The suite is stdlib-only and asserts byte-identical output across
        # platforms; running both OSes is what proves the skill's
        # cross-platform claim. The label keeps the job name (which branch
        # protection references) stable across runner image renames.
        include:
          - os: ubuntu-latest
            label: ubuntu
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Oldest version the skill supports, per pyproject requires-python.
          python-version: '3.8'

      - name: Run tests
        run: python tests/run_tests.py

  plugin-manifests:
    name: Validations / agent plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        env:
          # Audit is advisory-only and its registry endpoint outages stall npm
          # for minutes, so skip it for this throwaway toolchain install.
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: npm install -g @anthropic-ai/claude-code

      # Validation is local; no API key involved. On the repo root the CLI
      # picks marketplace.json and ignores plugin.json, so validate the
      # plugin manifest by explicit path as well.
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json

  version-sync:
    name: Validations / versions synced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # semantic-release rewrites all three copies on release (see
      # version_variables in pyproject.toml); this guards manual edits from
      # letting them drift in between.
      - name: Check the version copies agree
        run: |
          python3 - <<'EOF'
          import json, re, sys, tomllib

          versions = {}
          with open("pyproject.toml", "rb") as f:
              versions["pyproject.toml"] = tomllib.load(f)["project"]["version"]
          with open(".claude-plugin/plugin.json") as f:
              versions["plugin.json"] = json.load(f)["version"]
          with open("skills/render-spec/SKILL.md") as f:
              match = re.search(r'^\s*version:\s*"?([^"\s]+)"?\s*$', f.read(), re.M)
          if not match:
              sys.exit("No version found in SKILL.md frontmatter.")
          versions["SKILL.md"] = match.group(1)

          for name, version in versions.items():
              print(f"{name}: {version}")
          if len(set(versions.values())) != 1:
              sys.exit("Version copies have drifted.")
          EOF
