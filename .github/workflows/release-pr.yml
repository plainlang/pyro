name: Release PR

# Keeps bot-maintained PRs into dev holding the next release commit, one per
# channel (release-next for stable, prerelease-next for rc); rebase-merging
# one is what cuts a release.

on:
  push:
    branches: [dev]
  # Dispatching opens the rc release PR, which is never opened automatically.
  workflow_dispatch:

# Only the newest state of dev matters; supersede older refresh runs.
concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-pr:
    name: Maintain ${{ matrix.channel }} release PR
    # Skip release commit pushes entirely: release.yml handles them and
    # re-dispatches this workflow once the new tag exists.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: Release ')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the stable PR opens on its own; the rc PR takes a manual
          # dispatch to open, and is then refreshed like the stable one.
          - channel: stable
            branch: release-next
            auto_open: true
          - channel: rc
            branch: prerelease-next
            auto_open: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, or semantic-release cannot see the last release.
          fetch-depth: 0
          ref: dev
          # Don't let GITHUB_TOKEN shadow the bot token.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-semantic-release
        run: pip install python-semantic-release==10.6.2

      - name: Compute next ${{ matrix.channel }} version
        id: version
        run: |
          if [ '${{ matrix.channel }}' = 'stable' ]; then
            # semantic-release picks its release group by branch name: a local
            # branch named "main" selects the stable group while pointing at
            # dev's content; dev itself yields the rc group.
            git checkout -B main
          fi
          NEXT="$(semantic-release version --print)"
          LAST="$(semantic-release version --print-last-released || true)"
          if [ -n "$NEXT" ] && [ "$NEXT" != "$LAST" ]; then
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      # The bot skips the branch protection checks.
      - name: Sign in as release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Look up the open release PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head '${{ matrix.branch }}' --base dev --state open --json number --jq '.[].number')"
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Close the release PR when nothing is releasable
        if: steps.version.outputs.version == '' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr close '${{ steps.pr.outputs.number }}' --repo "$GITHUB_REPOSITORY" \
            --comment "Nothing releasable on dev anymore." --delete-branch

      - name: Build the release commit
        # Without an open PR, only auto_open channels and manual dispatches
        # may create one.
        if: >-
          steps.version.outputs.version != '' &&
          (matrix.auto_open || steps.pr.outputs.number != '' || github.event_name == 'workflow_dispatch')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # semantic-release takes the commit author from this env var; it
          # ignores git config.
          GIT_COMMIT_AUTHOR: 'plainlang-release[bot] <324082215+plainlang-release[bot]@users.noreply.github.com>'
        run: |
          # GITHUB_OUTPUT is hidden from semantic-release: its Actions-output
          # writer demands a commit_sha that is only recorded when tagging,
          # which --no-tag skips, so it would crash after committing.
          env -u GITHUB_OUTPUT semantic-release version --no-tag --no-push --no-vcs-release
          if [ "$(git log -1 --format=%s)" != "chore: Release ${VERSION}" ]; then
            echo "Expected the release commit for ${VERSION} on HEAD, found: $(git log -1 --format=%s)" >&2
            exit 1
          fi
          # The changelog lines this commit adds double as the PR body.
          git show HEAD --format='' --unified=0 -- CHANGELOG.md \
            | grep -v '^+++' | grep '^+' | cut -c2- > /tmp/release-notes.md

      - name: Push ${{ matrix.branch }} and upsert the PR
        if: >-
          steps.version.outputs.version != '' &&
          (matrix.auto_open || steps.pr.outputs.number != '' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A release may have landed on dev while this run was working;
          # don't resurrect a stale PR over it.
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "$(git rev-parse HEAD~1)" ]; then
            echo "dev moved during this run; the next push refreshes the PR." >&2
            exit 0
          fi
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            'HEAD:refs/heads/${{ matrix.branch }}'
          TITLE="chore: Release ${VERSION}"
          if [ -n '${{ steps.pr.outputs.number }}' ]; then
            gh pr edit '${{ steps.pr.outputs.number }}' --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file /tmp/release-notes.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head '${{ matrix.branch }}' \
              --title "$TITLE" --body-file /tmp/release-notes.md
          fi
