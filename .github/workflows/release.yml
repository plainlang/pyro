name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# One release at a time per branch: two pushes in quick succession would
# otherwise race for the same version.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, or semantic-release cannot see the last release.
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # The default GITHUB_TOKEN cannot push to main/dev (branch ruleset), so
      # the release commit is pushed as the plainlang-release-bot app, which is
      # on the ruleset's bypass list. Unlike GITHUB_TOKEN pushes, app-token
      # pushes trigger workflows: Lint runs on the release commit and Release
      # re-runs once as a no-op (a chore commit never bumps the version).
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}

      - name: Version, tag and release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: 'plainlang-release-bot[bot]'
          git_committer_email: '324082215+plainlang-release-bot[bot]@users.noreply.github.com'
          # Changelog is maintained on main only.
          changelog: ${{ github.ref_name == 'main' }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }} - ${{ steps.release.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: nothing in this push bumped the version." >> "$GITHUB_STEP_SUMMARY"
          fi
