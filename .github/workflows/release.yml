name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# One release at a time per branch: two pushes in quick succession would
# otherwise race for the same version.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    # Skip the bot's own release push.
    if: github.actor != 'plainlang-release[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, or semantic-release cannot see the last release.
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # Don't let GITHUB_TOKEN shadow the bot token.
          persist-credentials: false

      # The bot skips the branch protection checks.
      - name: Sign in as release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Stamp version and publish
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: 'plainlang-release[bot]'
          git_committer_email: '324082215+plainlang-release[bot]@users.noreply.github.com'
          # Changelog is maintained on main only.
          changelog: ${{ github.ref_name == 'main' }}

      - name: Release summary
        if: always()
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }} - ${{ steps.release.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: nothing in this push bumped the version." >> "$GITHUB_STEP_SUMMARY"
          fi
