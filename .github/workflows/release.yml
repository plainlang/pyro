name: Release

# Turns a merged release PR into a release: tag and GitHub release for both
# channels, plus a fast-forward of main to the release commit for stable.

on:
  push:
    branches: [dev]

# One release at a time; never cancel a half-done release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the last step re-dispatch the Release PR workflow.
  actions: write

jobs:
  release:
    name: Tag and publish release
    # Only release commits — a merged release PR of either channel.
    if: "startsWith(github.event.head_commit.message, 'chore: Release ')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      # The notify job replies in the start notice's thread.
      slack-ts: ${{ steps.slack-start.outputs.ts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev
          # Don't let GITHUB_TOKEN shadow the bot token.
          persist-credentials: false

      - name: Read and verify the release version
        id: version
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          SUBJECT="$(git log -1 --format=%s)"
          if [ "$SUBJECT" != "chore: Release ${VERSION}" ]; then
            echo "Commit subject '${SUBJECT}' does not match pyproject version '${VERSION}'." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # First step that knows the version. Non-fatal: Slack being down must not
      # block the release.
      - name: Notify Slack (start)
        id: slack-start
        if: ${{ vars.SLACK_CHANNEL_ID != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            text: >-
              *pyro*: ${{ steps.version.outputs.prerelease == 'true' && 'pre-release' || 'release' }} `v${{ steps.version.outputs.version }}` merged by *${{ github.actor }}*
              — tagging and publishing on GitHub...

      # The bot skips the branch protection checks.
      - name: Sign in as release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}"

      - name: Fast-forward main
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fast-forward by construction: main is an ancestor of dev. Git
          # rejecting a non-ff push here is the safety net for a broken invariant.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The changelog lines the release commit added are the release notes.
          git show HEAD --format='' --unified=0 -- CHANGELOG.md \
            | grep -v '^+++' | grep '^+' | cut -c2- > /tmp/release-notes.md
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" --notes-file /tmp/release-notes.md \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease)

      # The Release PR workflow skips release commit pushes to avoid racing
      # this run; now that the tag exists, let it rebase or close its PRs.
      - name: Refresh the release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-pr.yml --repo "$GITHUB_REPOSITORY" --ref dev

      - name: Release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "Released v${VERSION} at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"

  # Stable releases only; pre-releases stay out of the Linear pipeline.
  linear-release:
    name: Record release in Linear
    needs: release
    if: ${{ needs.release.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    # pull-requests lets the step look up each commit's PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # The notify job links the release, or says recording it failed.
      release-url: ${{ steps.linear.outputs.release-url }}
      outcome: ${{ steps.linear.outcome }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release gets the PRs merged since the previous one, and the GitHub
      # release text as notes; a re-run updates it. Log-only until
      # LINEAR_RELEASE_MODE is "live". Non-fatal: the release is already out.
      - name: Record release in Linear
        id: linear
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
          LINEAR_RELEASE_MODE: ${{ vars.LINEAR_RELEASE_MODE }}
          RELEASE_VERSION: v${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: dev
          RELEASE_NOTES: github-release
        with:
          script: return require('./.github/scripts/record-linear-release.cjs')({ github, context, core })

  # End-of-run notices run in their own job: a failed Slack post fails only this
  # job, not the release, and "Re-run failed jobs" re-posts without releasing
  # again.
  notify:
    name: Notify Slack
    # linear-release is skipped for pre-releases and failed releases; this job still runs.
    needs: [release, linear-release]
    # Pushes to dev that are not release commits skip the release job and post
    # nothing.
    if: ${{ !cancelled() && vars.SLACK_CHANNEL_ID != '' && contains(fromJSON('["success", "failure"]'), needs.release.result) }}
    runs-on: ubuntu-latest
    permissions: {}

    env:
      VERSION: ${{ needs.release.outputs.version }}
      # Notices reply in the start notice's thread, quoted so YAML keeps the ts a
      # string. Without a start notice (its post failed or never ran) this is null,
      # which the Slack client drops, and they post to the channel. Failures are
      # also broadcast to the channel; success stays in the thread.
      THREAD_TS: ${{ needs.release.outputs.slack-ts && format('"{0}"', needs.release.outputs.slack-ts) || 'null' }}

    steps:
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # A failed version check leaves no version; the commit names the release.
      - name: Notify Slack (failure)
        if: ${{ needs.release.result == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            reply_broadcast: ${{ env.THREAD_TS != 'null' }}
            text: >-
              *pyro*: release `${{ env.VERSION && format('v{0}', env.VERSION) || env.SHORT_SHA }}` FAILED :x:.
              See <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the run log>.

      - name: Notify Slack (pre-release published)
        if: ${{ needs.release.result == 'success' && needs.release.outputs.prerelease == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            text: >-
              *pyro*: pre-release `v${{ env.VERSION }}` published on GitHub :test_tube:.
              `main` is unchanged, so plugin installs stay on the stable release. <${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ env.VERSION }}|Release notes>.

      - name: Notify Slack (release published)
        if: ${{ needs.release.result == 'success' && needs.release.outputs.prerelease == 'false' }}
        env:
          # Empty while the release step only logs, or when it failed.
          RELEASE_URL: ${{ needs.linear-release.outputs.release-url }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            thread_ts: ${{ env.THREAD_TS }}
            text: >-
              *pyro*: `v${{ env.VERSION }}` released :white_check_mark: and `main` moved to it.
              Update with `claude plugin marketplace update pyro && claude plugin update pyro`, then restart. <${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ env.VERSION }}|Release notes>.${{ env.RELEASE_URL != '' && format(' <{0}|View release>.', env.RELEASE_URL) || needs.linear-release.outputs.outcome == 'failure' && ' Recording it in Linear failed :warning:.' || '' }}

      # Success also puts a ✅ on the start notice, so the result shows in the
      # channel without another message. Needs the app's reactions:write scope.
      # Non-fatal: the result is already posted, and a re-run gets already_reacted.
      - name: Notify Slack (✅ on the start notice)
        if: ${{ needs.release.result == 'success' && env.THREAD_TS != 'null' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: reactions.add
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ vars.SLACK_CHANNEL_ID }}
            timestamp: ${{ env.THREAD_TS }}
            name: white_check_mark
