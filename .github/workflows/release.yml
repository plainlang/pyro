name: Release

# Turns a merged release PR into a release: tag and GitHub release for both
# channels, plus a fast-forward of main to the release commit for stable.

on:
  push:
    branches: [dev]

# One release at a time; never cancel a half-done release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the last step re-dispatch the Release PR workflow.
  actions: write

jobs:
  release:
    name: Tag and publish release
    # Only release commits — a merged release PR of either channel.
    if: "startsWith(github.event.head_commit.message, 'chore: Release ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev
          # Don't let GITHUB_TOKEN shadow the bot token.
          persist-credentials: false

      - name: Read and verify the release version
        id: version
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          SUBJECT="$(git log -1 --format=%s)"
          if [ "$SUBJECT" != "chore: Release ${VERSION}" ]; then
            echo "Commit subject '${SUBJECT}' does not match pyproject version '${VERSION}'." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The bot skips the branch protection checks.
      - name: Sign in as release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${VERSION}"

      - name: Fast-forward main
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fast-forward by construction: main is an ancestor of dev. Git
          # rejecting a non-ff push here is the safety net for a broken invariant.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The changelog lines the release commit added are the release notes.
          git show HEAD --format='' --unified=0 -- CHANGELOG.md \
            | grep -v '^+++' | grep '^+' | cut -c2- > /tmp/release-notes.md
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" --notes-file /tmp/release-notes.md \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease)

      # The Release PR workflow skips release commit pushes to avoid racing
      # this run; now that the tag exists, let it rebase or close its PRs.
      - name: Refresh the release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-pr.yml --repo "$GITHUB_REPOSITORY" --ref dev

      - name: Release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "Released v${VERSION} at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
