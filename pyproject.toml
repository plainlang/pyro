# This repo ships an agentic skill, not a Python distribution. The file
# exists so python-semantic-release has a config home.
[project]
name = "pyro"
version = "0.1.0-rc.2"
description = "Renders a .plain specification module into working, tested code."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["plain", "spec", "codegen", "render", "sdd"]

[project.urls]
Homepage = "https://github.com/plainlang/pyro"
Repository = "https://github.com/plainlang/pyro"

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"

# Still pre-1.0: keep 0.x, and let a breaking change bump the minor rather than
# jumping to 1.0.0 on its own. Flip major_on_zero to graduate the project.
allow_zero_version = true
major_on_zero = false

# The release commit lands on main/dev, where commitlint checks it, so the
# subject has to be conventional.
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release."

version_toml = ["pyproject.toml:project.version"]

# pyproject is the authoritative version; these copies follow it, so the plugin
# manifest and the skill's own metadata cannot drift from a release.
version_variables = [
  ".claude-plugin/plugin.json:version",
  "skills/render-spec/SKILL.md:version",
]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

# Order matters: the first matching group wins.
[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.branches.dev]
match = "^dev$"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.publish]
# No build artifacts to attach to the GitHub release.
upload_to_vcs_release = false
